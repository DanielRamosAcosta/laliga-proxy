[package]
name = "laliga-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Conditional forward proxy that reroutes traffic through a VPN upstream while LaLiga is blocking Cloudflare IPs"
license = "MIT"
repository = "https://github.com/DanielRamosAcosta/laliga-proxy"
readme = "README.md"
keywords = ["proxy", "laliga", "cloudflare", "vpn", "gluetun"]
categories = ["network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
